<!DOCTYPE html>
{% load static %}
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <style>
    /* General Reset */
    body {
      margin: 0;
      padding: 0;
      font-family: "Gill Sans", sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh; /* Ensures full height of viewport */
    }

    /* Header Styles */
    header {
      position: fixed;
      background: #22242A;
      padding: 20px;
      width: 100%;
      z-index: 1;
    }

    .left_area h3 {
      color: #fff;
      margin: 0px;
      text-transform: uppercase;
      font-size: 22px;
      font-weight: 900;
    }

    .logout_btn {
      padding: 5px;
      background: #19B3D3;
      text-decoration: none;
      float: right;
      margin-top: -30px;
      margin-right: 40px;
      border-radius: 2px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      transition: 0.5s;
    }

    .logout_btn:hover {
      background: #0B87A6;
    }

    /* Sidebar Styles */
    .sidebar {
      background: #2f323a;
      margin-top: 70px;
      padding-top: 30px;
      position: fixed;
      left: 0;
      width: 250px;
      height: 100%;
    }

    .sidebar .profile_image {
      width: 100px;
      height: 100px;
      border-radius: 100px;
      margin-bottom: 10px;
    }

    .sidebar h4 {
      color: #ccc;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .sidebar a {
      color: #fff;
      display: block;
      line-height: 60px;
      text-decoration: none;
      padding-left: 40px;
      box-sizing: border-box;
      transition: 0.5s;
    }

    .sidebar a:hover {
      background: #19B3D3;
    }

    /* Content Styles */
    .content {
      margin-left: 250px;
      margin-top: 100px;
      flex: 1; /* Pushes the footer to the bottom */
      padding: 20px;
      background: url(background.png) no-repeat center center;
      background-size: cover;
    }

    /* Footer Styles */
    footer {
      background-color: #212529;
      color: #ffffff;
      text-align: center;
      padding: 20px 0;
    }

    .fa {
      padding: 20px;
      font-size: 23px;
      width: 60px;
      text-align: center;
      text-decoration: none;
      margin: 5px 2px;
      border-radius: 50%;
    }

    .fa:hover {
      opacity: 0.5;
      text-decoration: none;
    }
  </style>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.1/css/all.min.css">
</head>

<body>
  <!-- Header -->
  <header>
    <div class="left_area">
      <h3>Vizhuchelvam</h3>
    </div>
    <div class="right_area">
      <a href="/logout" class="logout_btn">Logout</a>
    </div>
  </header>

  <!-- Sidebar -->
  <div class="sidebar">
    <center>
      <img src="{% static 'image/admin.png' %}" class="profile_image" alt="">
      <h4>Admin</h4>
    </center>
    <a href="/admin-dashboard"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
    <a href="/admin-teacher"><i class="fas fa-chalkboard-teacher"></i><span>Teacher</span></a>
    <a href="/admin-student"><i class="fas fa-user-graduate"></i><span>Student</span></a>
    <a href="/admin-course"><i class="fas fa-book"></i><span>Courses</span></a>
    <a href="/admin-question"><i class="fas fa-question-circle"></i><span>Questions</span></a>
  </div>

  <!-- Content -->
  <div class="content">
    {% block content %}
    {% endblock content %}
  </div>

  <!-- Footer -->
  <footer>
    Vizhuchelvam 2024 &copy; All rights reserved.
  </footer>
</body>

</html>
